<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天賦測驗 · 你一直用錯的那個自己</title>
<style>
:root{--bg:#faf7f2;--fg:#1d1a16;--muted:#6b635a;--line:#e0d8cc;--card:#fff;--accent:#8a5a2b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--fg:#f2ece3;--muted:#9c9287;--line:#332e27;--card:#1e1a15;--accent:#d2a06a}}
:root[data-theme="dark"]{--bg:#15130f;--fg:#f2ece3;--muted:#9c9287;--line:#332e27;--card:#1e1a15;--accent:#d2a06a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif TC","Songti TC",Georgia,serif;line-height:1.75}
.wrap{max-width:680px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:1.9rem;margin:0 0 8px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 28px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.qn{color:var(--accent);font-size:.8rem;letter-spacing:.14em;margin-bottom:6px}
.qt{font-size:1.12rem;margin:0 0 16px;font-weight:600}
button.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;font:inherit;font-size:.97rem;cursor:pointer;transition:.15s}
button.opt:hover{border-color:var(--accent);transform:translateX(3px)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-bottom:26px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.12em;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:3px 11px;margin-bottom:10px}
h2{font-size:1.4rem;margin:.2em 0 .4em}
h3{font-size:1rem;margin:18px 0 4px;color:var(--accent)}
p{margin:.4em 0}
ul{margin:.4em 0;padding-left:1.2em}
.quote{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted);font-style:italic;margin:18px 0}
.row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);padding:6px 0;border-bottom:1px dotted var(--line)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:99px;padding:11px 26px;font:inherit;cursor:pointer;margin-top:12px}
small{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
<h1>你一直用錯的那個自己</h1>
<p class="sub">10 條問題。不要問自己「我想做什麼工作」——那個答案已經被你的履歷綁架了。只答你真實的反應。</p>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div>
</div>
<script>
const T={
A:{n:"織網者",l:"你的能力不在你身上，在你連起來的人之間。",g:["記得住人的細節、情緒、關係","能把互不相干的人變成一件事","在混亂中自然變成中心點"],w:["業務開發、客戶關係、公關","社群／活動營運、品牌合作","招聘、獵頭、人才發展","任何『資源整合』位置"],t:"你會誤以為那只是『識人多』，不值錢。其實這是最難複製的資產。"},
B:{n:"解謎者",l:"別人看到一團亂，你看到結構。",g:["會自動把問題拆細、找因果","忍受不了沒有邏輯的決定","對數字、規則、系統敏感"],w:["數據分析、研究、策略規劃","財務、風險、營運優化","產品／系統設計、流程改造","顧問、審計、法規相關"],t:"你會卡在『想清楚才做』。你的分析要接上一個會出手的人，才變成錢。"},
C:{n:"造物者",l:"沒有交出實物的一天，對你來說等於沒活過。",g:["手快、落地、做得出成品","對質素和細節有近乎生理的要求","從 0 到完成的耐力"],w:["工藝、修復、製作、佈展","產品／營運執行、專案落地","廚藝、空間、器物、手作品牌","任何看得見成果的技術工種"],t:"你容易被當成『執行的人』而非決策者。要學會把成品說成故事，否則功勞被人收。"},
D:{n:"說故事者",l:"同一件事，經你的口會變成另一件事。",g:["用比喻、畫面、節奏去理解世界","對美感、語感、氛圍極敏感","能把抽象的東西變成人聽得懂的"],w:["內容創作、文案、編輯","品牌策劃、設計、視覺指導","培訓、講者、課程設計","諮詢類服務中的『詮釋者』角色"],t:"你會覺得這是天生的、不算本事。市場上最貴的正是這種翻譯能力。"},
E:{n:"開路者",l:"你不是喜歡冒險，你是受不了停著。",g:["在資訊不足時仍能決斷","願意做第一個丟臉的人","對『從無到有』有莫名的興奮"],w:["創業、開新市場、新品牌線","銷售前線、商務拓展","專案主導、轉型／救火位置","自由接案、多線並行"],t:"你的敵人是收尾。找一個守護者或造物者做搭檔，你的爆發力才不會歸零。"},
F:{n:"守護者",l:"你的價值在別人身上顯現，所以你常常看不見它。",g:["感受得到別人未說出口的狀態","願意把關、承擔、收拾","讓人安心的能力"],w:["教育、輔導、身心照護","客戶成功、客服管理、HR","品質管理、風險把關、行政核心","療癒／諮詢類個人服務"],t:"你最容易把天賦免費送出去。要練的不是能力，是定價。"}};
const Q=[
["小時候，大人最常唸你的一句是？",[["「不要再把東西拆爛」","B"],["「你又跟人講這麼久電話」","A"],["「不要發白日夢」","D"],["「你不要這麼多事管」","F"]]],
["公司突然說重要客戶提早一天到，全場亂成一團。你的第一個動作是？",[["拉群組、分工、把人找齊","A"],["列出所有未完成項目和風險點","B"],["動手把場地／文件弄到見得人","C"],["改講稿，想怎樣講才打動他","D"]]],
["你手機相簿裡最多的是？",[["人和人在一起的畫面","A"],["沒去過的地方、想去的清單","E"],["完成品、成果、before/after","C"],["光線、質感、街角、細節","D"]]],
["有一筆不用還的錢，一年內要用完。你會？",[["去一個完全沒計劃的地方","E"],["買齊想要的設備、開一間工作室","C"],["進修一門很深的專業","B"],["分給身邊需要的人，看著他們變好","F"]]],
["你最忍受不了的工作環境是？",[["整天一個人，沒人可以講話","A"],["朝令夕改，而且沒有解釋","B"],["做來做去交不出一件實物","C"],["什麼都要跟 template，不准有自己的味道","D"]]],
["朋友聚會時，你通常是？",[["負責約人、記得誰不吃牛的那個","F"],["冷場時講故事的那個","D"],["提議「不如今晚去個新地方」的那個","E"],["埋單分帳、算得清清楚楚的那個","B"]]],
["你曾經免費做、做到通宵也不覺得辛苦的事是？",[["幫人拆解一個死局","B"],["幫人搭路、介紹人認識人","A"],["做出一件實物、弄好一個 setup","C"],["聽一個人講自己的事，聽到他哭","F"]]],
["你哪一點「太多」，常被人叫收斂？",[["太快，還沒想清楚就衝","E"],["太多問題，問到人煩","B"],["太執著細節，交不出貨","C"],["太投入別人的事，攬上身","F"]]],
["你最怕自己的人生變成哪一句？",[["「安全，但什麼都沒試過」","E"],["「做了很多，但沒留下任何東西」","C"],["「認識很多人，但沒一個真的認識我」","A"],["「幫了很多人，但沒人問過我好不好」","F"]]],
["一個完全陌生的難題丟給你，沒人幫。你最自然的第一步是？",[["找一個做過的人問","A"],["拆細、畫出流程","B"],["先做一個很爛的版本，再改","C"],["先找一個比喻，把它想成別的東西","D"]]]];
const max={};Q.forEach(q=>q[1].forEach(o=>max[o[1]]=(max[o[1]]||0)+1));
let i=0,s={A:0,B:0,C:0,D:0,E:0,F:0};
const app=document.getElementById("app"),bar=document.getElementById("bar");
function draw(){
 bar.style.width=(i/Q.length*100)+"%";
 if(i>=Q.length)return res();
 const q=Q[i];
 app.innerHTML='<div class="card"><div class="qn">'+String(i+1).padStart(2,"0")+' / '+Q.length+'</div><p class="qt">'+q[0]+'</p>'+
 q[1].map((o,k)=>'<button class="opt" data-k="'+o[1]+'">'+o[0]+'</button>').join("")+'</div>';
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{s[b.dataset.k]++;i++;draw();window.scrollTo(0,0)});
}
function res(){
 const r=Object.keys(T).map(k=>[k,s[k]/max[k]]).sort((a,b)=>b[1]-a[1]);
 const m=T[r[0][0]],sec=T[r[1][0]],low=T[r[5][0]];
 app.innerHTML='<div class="card"><span class="tag">你的主天賦</span><h2>'+m.n+'</h2><p>'+m.l+'</p>'+
 '<h3>你真正擅長的</h3><ul>'+m.g.map(x=>"<li>"+x+"</li>").join("")+'</ul>'+
 '<h3>把你放在這些位置會發光</h3><ul>'+m.w.map(x=>"<li>"+x+"</li>").join("")+'</ul>'+
 '<h3>你的盲點</h3><p>'+m.t+'</p></div>'+
 '<div class="card"><span class="tag">你的副天賦</span><h2>'+sec.n+'</h2><p>'+sec.l+'</p>'+
 '<div class="quote">你是一個用「'+sec.n+'」的方式去做「'+m.n+'」的人。單一天賦到處都有，這個組合才是你難以被取代的地方——寫履歷、談薪水、開業定位，都應該講這一句，而不是講你的職稱。</div>'+
 '<h3>組合後可以考慮的方向</h3><ul>'+[m.w[0],sec.w[0],m.w[2],sec.w[2]].map(x=>"<li>"+x+"</li>").join("")+'</ul></div>'+
 '<div class="card"><span class="tag">跳出原有思維</span><h2>你最低分的是：'+low.n+'</h2><p>'+low.l+'</p>'+
 '<h3>「'+low.n+'」是怎樣的人</h3><ul>'+low.g.map(x=>"<li>"+x+"</li>").join("")+'</ul>'+
 '<p><small>典型位置：'+low.w.slice(0,3).join("、")+'</small></p>'+
 '<h3>為什麼這對你重要</h3><p>這不是你的弱點，而是它不應該是你的主線。請誠實回答一件事：<b>你現在的工作，有多少時間在做「'+low.n+'」的事？</b></p>'+
 '<p>很多人一直用自己最弱的那條線去謀生，然後以為自己「能力不足」、「不夠努力」。其實只是位置放錯了。真正要改的通常不是你這個人，而是你被安排的角色。</p>'+
 '<h3>本週可以做的三件事</h3><ul><li>把你過去一週的工作列出來，標記哪些屬於「'+m.n+'」，哪些屬於「'+low.n+'」。</li><li>找一件本來由你做、但其實屬於「'+low.n+'」的事，試著交出去或簡化。</li><li>主動爭取一件「'+m.n+'」的事，即使不在你的職責範圍。</li></ul></div>'+
 '<div class="card"><h3>六個面向的分佈</h3>'+r.map(x=>'<div class="row"><span>'+T[x[0]].n+'</span><span>'+Math.round(x[1]*100)+'%</span></div>').join("")+
 '<button class="btn" onclick="location.reload()">重新測一次</button><p><small>此測驗為自我探索工具，並非臨床心理評估。</small></p></div>';
}
draw();
</script>
</body>
</html>
